
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReNewMarket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>ReNewMarket</h1>
    <p>Buy, Sell and Reuse Second-Hand Products</p>
</header>

<nav>
    <button onclick="showSection('users')">User Management</button>
    <button onclick="showSection('categories')">Category Management</button>
    <button onclick="showSection('products')">Commodity Management</button>
    <button onclick="showSection('orders')">Order Management</button>
</nav>

<main>
    <section id="users" class="section">
        <h2>User Management</h2>

        <input type="text" id="username" placeholder="Enter username">
        <input type="password" id="password" placeholder="Enter password">
        <button onclick="login()">Admin Login</button>

        <p id="loginStatus">Please log in as administrator.</p>

        <div id="userControls" hidden>
            <h3>Add User</h3>
            <input type="text" id="newUser" placeholder="User name">
            <button onclick="addUser()">Add User</button>
            <ul id="userList"></ul>
        </div>
    </section>

    <section id="categories" class="section" hidden>
        <h2>Category Management</h2>
        <input type="text" id="categoryName"
               placeholder="Enter category name">
        <button onclick="addCategory()">Add Category</button>
        <ul id="categoryList"></ul>
    </section>

    <section id="products" class="section" hidden>
        <h2>Commodity Management</h2>

        <input type="text" id="productName"
               placeholder="Product name">
        <input type="number" id="productPrice"
               placeholder="Price (₹)">
        <select id="productCategory">
            <option value="">Select category</option>
        </select>

        <button onclick="addProduct()">Add Product</button>
        <div id="productList"></div>
    </section>

    <section id="orders" class="section" hidden>
        <h2>Order Management</h2>
        <p>Manage shipping and delivery status.</p>
        <div id="orderList"></div>
    </section>
</main>

<footer>
    <p>© 2026 ReNewMarket | Reuse Today, Save Tomorrow</p>
</footer>

<script src="script.js"></script>
</body>
</html>
